              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "attack_groups_5", "label": "attack_groups_5", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_19", "label": "campaigns_19", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_13", "label": "attack_groups_13", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_6", "label": "campaigns_6", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_16", "label": "campaigns_16", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_21", "label": "campaigns_21", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_21", "label": "attack_groups_21", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_4", "label": "campaigns_4", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_13", "label": "campaigns_13", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_75", "label": "attack_groups_75", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_14", "label": "campaigns_14", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_18", "label": "campaigns_18", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_106", "label": "attack_groups_106", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_0", "label": "campaigns_0", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_127", "label": "attack_groups_127", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "campaigns_2", "label": "campaigns_2", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "attack_groups_134", "label": "attack_groups_134", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "admin@338 is a China-based cyber threat group. It has previously used newsworthy events as lures to deliver malware and has primarily targeted organizations involved in financial, economic, and trade policy, typically using publicly available RATs such as PoisonIvy, as well as some non-public backdoors.", "id": "attack_groups_G0018", "label": "admin@338", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Ajax Security Team is a group that has been active since at least 2010 and believed to be operating out of Iran. By 2014 Ajax Security Team transitioned from website defacement operations to malware-based cyber espionage campaigns targeting the US defense industrial base and Iranian users of anti-censorship technologies.", "id": "attack_groups_G0130", "label": "Ajax Security Team", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "ALLANITE is a suspected Russian cyber espionage group, that has primarily targeted the electric utility sector within the United States and United Kingdom. The group\u0027s tactics and techniques are reportedly similar to Dragonfly, although ALLANITEs technical capabilities have not exhibited disruptive or destructive abilities. It has been suggested that the group maintains a presence in ICS for the purpose of gaining understanding of processes and to maintain persistence.", "id": "attack_groups_G1000", "label": "ALLANITE", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Andariel is a North Korean state-sponsored threat group that has been active since at least 2009. Andariel has primarily focused its operations--which have included destructive attacks--against South Korean government agencies, military organizations, and a variety of domestic companies; they have also conducted cyber financial operations against ATMs, banks, and cryptocurrency exchanges. Andariel\u0027s notable activity includes Operation Black Mine, Operation GoldenAxe, and Campaign Rifle.Andariel is considered a sub-set of Lazarus Group, and has been attributed to North Korea\u0027s Reconnaissance General Bureau.North Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups.", "id": "attack_groups_G0138", "label": "Andariel", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Aoqin Dragon is a suspected Chinese cyber espionage threat group that has been active since at least 2013. Aoqin Dragon has primarily targeted government, education, and telecommunication organizations in Australia, Cambodia, Hong Kong, Singapore, and Vietnam. Security researchers noted a potential association between Aoqin Dragon and UNC94, based on malware, infrastructure, and targets.", "id": "attack_groups_G1007", "label": "Aoqin Dragon", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT-C-36 is a suspected South America espionage group that has been active since at least 2018. The group mainly targets Colombian government institutions as well as important corporations in the financial sector, petroleum industry, and professional manufacturing.", "id": "attack_groups_G0099", "label": "APT-C-36", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT1 is a Chinese threat group that has been attributed to the 2nd Bureau of the People\u2019s Liberation Army (PLA) General Staff Department\u2019s (GSD) 3rd Department, commonly known by its Military Unit Cover Designator (MUCD) as Unit 61398.", "id": "attack_groups_G0006", "label": "APT1", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT12 is a threat group that has been attributed to China. The group has targeted a variety of victims including but not limited to media outlets, high-tech companies, and multiple governments.", "id": "attack_groups_G0005", "label": "APT12", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT16 is a China-based threat group that has launched spearphishing campaigns targeting Japanese and Taiwanese organizations.", "id": "attack_groups_G0023", "label": "APT16", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT17 is a China-based threat group that has conducted network intrusions against U.S. government entities, the defense industry, law firms, information technology companies, mining companies, and non-government organizations.", "id": "attack_groups_G0025", "label": "APT17", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT18 is a threat group that has operated since at least 2009 and has targeted a range of industries, including technology, manufacturing, human rights groups, government, and medical.", "id": "attack_groups_G0026", "label": "APT18", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT19 is a Chinese-based threat group that has targeted a variety of industries, including defense, finance, energy, pharmaceutical, telecommunications, high tech, education, manufacturing, and legal services. In 2017, a phishing campaign was used to target seven law and investment firms.  Some analysts track APT19 and Deep Panda as the same group, but it is unclear from open source information if the groups are the same.", "id": "attack_groups_G0073", "label": "APT19", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT28 is a threat group that has been attributed to Russia\u0027s General Staff Main Intelligence Directorate (GRU) 85th Main Special Service Center (GTsSS) military unit 26165. This group has been active since at least 2004.APT28 reportedly compromised the Hillary Clinton campaign, the Democratic National Committee, and the Democratic Congressional Campaign Committee in 2016 in an attempt to interfere with the U.S. presidential election.  In 2018, the US indicted five GRU Unit 26165 officers associated with APT28 for cyber operations (including close-access operations) conducted between 2014 and 2018 against the World Anti-Doping Agency (WADA), the US Anti-Doping Agency, a US nuclear facility, the Organization for the Prohibition of Chemical Weapons (OPCW), the Spiez Swiss Chemicals Laboratory, and other organizations. Some of these were conducted with the assistance of GRU Unit 74455, which is also referred to as Sandworm Team.", "id": "attack_groups_G0007", "label": "APT28", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT29 is threat group that has been attributed to Russia\u0027s Foreign Intelligence Service (SVR). They have operated since at least 2008, often targeting government networks in Europe and NATO member countries, research institutes, and think tanks. APT29 reportedly compromised the Democratic National Committee starting in the summer of 2015.In April 2021, the US and UK governments attributed the SolarWinds Compromise to the SVR; public statements included citations to APT29, Cozy Bear, and The Dukes. Industry reporting also referred to the actors involved in this campaign as UNC2452, NOBELIUM, StellarParticle, Dark Halo, and SolarStorm.", "id": "attack_groups_G0016", "label": "APT29", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT3 is a China-based threat group that researchers have attributed to China\u0027s Ministry of State Security. This group is responsible for the campaigns known as Operation Clandestine Fox, Operation Clandestine Wolf, and Operation Double Tap. As of June 2015, the group appears to have shifted from targeting primarily US victims to primarily political organizations in Hong Kong.In 2017, MITRE developed an APT3 Adversary Emulation Plan.", "id": "attack_groups_G0022", "label": "APT3", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT30 is a threat group suspected to be associated with the Chinese government. While Naikon shares some characteristics with APT30, the two groups do not appear to be exact matches.", "id": "attack_groups_G0013", "label": "APT30", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT32 is a suspected Vietnam-based threat group that has been active since at least 2014. The group has targeted multiple private sector industries as well as foreign governments, dissidents, and journalists with a strong focus on Southeast Asian countries like Vietnam, the Philippines, Laos, and Cambodia. They have extensively used strategic web compromises to compromise victims.", "id": "attack_groups_G0050", "label": "APT32", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT33 is a suspected Iranian threat group that has carried out operations since at least 2013. The group has targeted organizations across multiple industries in the United States, Saudi Arabia, and South Korea, with a particular interest in the aviation and energy sectors.", "id": "attack_groups_G0064", "label": "APT33", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT37 is a North Korean state-sponsored cyber espionage group that has been active since at least 2012. The group has targeted victims primarily in South Korea, but also in Japan, Vietnam, Russia, Nepal, China, India, Romania, Kuwait, and other parts of the Middle East. APT37 has also been linked to the following campaigns between 2016-2018: Operation Daybreak, Operation Erebus, Golden Time, Evil New Year, Are you Happy?, FreeMilk, North Korean Human Rights, and Evil New Year 2018.North Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups.", "id": "attack_groups_G0067", "label": "APT37", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT38 is a North Korean state-sponsored threat group that specializes in financial cyber operations; it has been attributed to the Reconnaissance General Bureau. Active since at least 2014, APT38 has targeted banks, financial institutions, casinos, cryptocurrency exchanges, SWIFT system endpoints, and ATMs in at least 38 countries worldwide. Significant operations include the 2016 Bank of Bangladesh heist, during which APT38 stole $81 million, as well as attacks against Bancomext (2018) and Banco de Chile (2018); some of their attacks have been destructive.North Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups.", "id": "attack_groups_G0082", "label": "APT38", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT39 is one of several names for cyber espionage activity conducted by the Iranian Ministry of Intelligence and Security (MOIS) through the front company Rana Intelligence Computing since at least 2014. APT39 has primarily targeted the travel, hospitality, academic, and telecommunications industries in Iran and across Asia, Africa, Europe, and North America to track individuals and entities considered to be a threat by the MOIS.", "id": "attack_groups_G0087", "label": "APT39", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "APT41 is a threat group that researchers have assessed as Chinese state-sponsored espionage group that also conducts financially-motivated operations. Active since at least 2012, APT41 has been observed targeting healthcare, telecom, technology, and video game industries in 14 countries. APT41 overlaps at least partially with public reporting on groups including BARIUM and Winnti Group.", "id": "attack_groups_G0096", "label": "APT41", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Aquatic Panda is a suspected China-based threat group with a dual mission of intelligence collection and industrial espionage. Active since at least May 2020, Aquatic Panda has primarily targeted entities in the telecommunications, technology, and government sectors.", "id": "attack_groups_G0143", "label": "Aquatic Panda", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Axiom is a suspected Chinese cyber espionage group that has targeted the aerospace, defense, government, manufacturing, and media sectors since at least 2008. Some reporting suggests a degree of overlap between Axiom and Winnti Group but the two groups appear to be distinct based on differences in reporting on TTPs and targeting.", "id": "attack_groups_G0001", "label": "Axiom", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "BackdoorDiplomacy is a cyber espionage threat group that has been active since at least 2017. BackdoorDiplomacy has targeted Ministries of Foreign Affairs and telecommunication companies in Africa, Europe, the Middle East, and Asia.", "id": "attack_groups_G0135", "label": "BackdoorDiplomacy", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "BITTER is a suspected South Asian cyber espionage threat group that has been active since at least 2013. BITTER has primarily targeted government, energy, and engineering organizations in Pakistan, China, Bangladesh, and Saudi Arabia.", "id": "attack_groups_G1002", "label": "BITTER", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "BlackOasis is a Middle Eastern threat group that is believed to be a customer of Gamma Group. The group has shown interest in prominent figures in the United Nations, as well as opposition bloggers, activists, regional news correspondents, and think tanks.   A group known by Microsoft as NEODYMIUM is reportedly associated closely with BlackOasis operations, but evidence that the group names are aliases has not been identified.", "id": "attack_groups_G0063", "label": "BlackOasis", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "BlackTech is a suspected Chinese cyber espionage group that has primarily targeted organizations in East Asia--particularly Taiwan, Japan, and Hong Kong--and the US since at least 2013. BlackTech has used a combination of custom malware, dual-use tools, and living off the land tactics to compromise media, construction, engineering, electronics, and financial company networks.", "id": "attack_groups_G0098", "label": "BlackTech", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Blue Mockingbird is a cluster of observed activity involving Monero cryptocurrency-mining payloads in dynamic-link library (DLL) form on Windows systems. The earliest observed Blue Mockingbird tools were created in December 2019.", "id": "attack_groups_G0108", "label": "Blue Mockingbird", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Bouncing Golf is a cyberespionage campaign targeting Middle Eastern countries.", "id": "attack_groups_G0097", "label": "Bouncing Golf", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "BRONZE BUTLER is a cyber espionage group with likely Chinese origins that has been active since at least 2008. The group primarily targets Japanese organizations, particularly those in government, biotechnology, electronics manufacturing, and industrial chemistry.", "id": "attack_groups_G0060", "label": "BRONZE BUTLER", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Carbanak is a cybercriminal group that has used Carbanak malware to target financial institutions since at least 2013. Carbanak may be linked to groups tracked separately as Cobalt Group and FIN7 that have also used Carbanak malware.", "id": "attack_groups_G0008", "label": "Carbanak", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Chimera is a suspected China-based threat group that has been active since at least 2018 targeting the semiconductor industry in Taiwan as well as data from the airline industry.", "id": "attack_groups_G0114", "label": "Chimera", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Cleaver is a threat group that has been attributed to Iranian actors and is responsible for activity tracked as Operation Cleaver.  Strong circumstantial evidence suggests Cleaver is linked to Threat Group 2889 (TG-2889).", "id": "attack_groups_G0003", "label": "Cleaver", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Cobalt Group is a financially motivated threat group that has primarily targeted financial institutions since at least 2016. The group has conducted intrusions to steal money via targeting ATM systems, card processing, payment systems and SWIFT systems. Cobalt Group has mainly targeted banks in Eastern Europe, Central Asia, and Southeast Asia. One of the alleged leaders was arrested in Spain in early 2018, but the group still appears to be active. The group has been known to target organizations in order to use their access to then compromise additional victims. Reporting indicates there may be links between Cobalt Group and both the malware Carbanak and the group Carbanak.", "id": "attack_groups_G0080", "label": "Cobalt Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Confucius is a cyber espionage group that has primarily targeted military personnel, high-profile personalities, business persons, and government organizations in South Asia since at least 2013. Security researchers have noted similarities between Confucius and Patchwork, particularly in their respective custom malware code and targets.", "id": "attack_groups_G0142", "label": "Confucius", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "CopyKittens is an Iranian cyber espionage group that has been operating since at least 2013. It has targeted countries including Israel, Saudi Arabia, Turkey, the U.S., Jordan, and Germany. The group is responsible for the campaign known as Operation Wilted Tulip.", "id": "attack_groups_G0052", "label": "CopyKittens", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "CURIUM is an Iranian threat group first reported in November 2021 that has invested in building a relationship with potential targets via social media over a period of months to establish trust and confidence before sending malware. Security researchers note CURIUM has demonstrated great patience and persistence by chatting with potential targets daily and sending benign files to help lower their security consciousness.", "id": "attack_groups_G1012", "label": "CURIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Dark Caracal is threat group that has been attributed to the Lebanese General Directorate of General Security (GDGS) and has operated since at least 2012.", "id": "attack_groups_G0070", "label": "Dark Caracal", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Darkhotel is a suspected South Korean threat group that has targeted victims primarily in East Asia since at least 2004. The group\u0027s name is based on cyber espionage operations conducted via hotel Internet networks against traveling executives and other select guests. Darkhotel has also conducted spearphishing campaigns and infected victims through peer-to-peer and file sharing networks.", "id": "attack_groups_G0012", "label": "Darkhotel", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "DarkHydrus is a threat group that has targeted government agencies and educational institutions in the Middle East since at least 2016. The group heavily leverages open-source tools and custom payloads for carrying out attacks.", "id": "attack_groups_G0079", "label": "DarkHydrus", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "DarkVishnya is a financially motivated threat actor targeting financial institutions in Eastern Europe. In 2017-2018 the group attacked at least 8 banks in this region.", "id": "attack_groups_G0105", "label": "DarkVishnya", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Deep Panda is a suspected Chinese threat group known to target many industries, including government, defense, financial, and telecommunications.  The intrusion into healthcare company Anthem has been attributed to Deep Panda.  This group is also known as Shell Crew, WebMasters, KungFu Kittens, and PinkPanther.  Deep Panda also appears to be known as Black Vine based on the attribution of both group names to the Anthem intrusion.  Some analysts track Deep Panda and APT19 as the same group, but it is unclear from open source information if the groups are the same.", "id": "attack_groups_G0009", "label": "Deep Panda", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Dragonfly is a cyber espionage group that has been attributed to Russia\u0027s Federal Security Service (FSB) Center 16. Active since at least 2010, Dragonfly has targeted defense and aviation companies, government entities, companies related to industrial control systems, and critical infrastructure sectors worldwide through supply chain, spearphishing, and drive-by compromise attacks.", "id": "attack_groups_G0035", "label": "Dragonfly", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "DragonOK is a threat group that has targeted Japanese organizations with phishing emails. Due to overlapping TTPs, including similar custom tools, DragonOK is thought to have a direct or indirect relationship with the threat group Moafee.  It is known to use a variety of malware, including Sysget/HelloBridge, PlugX, PoisonIvy, FormerFirstRat, NFlog, and NewCT.", "id": "attack_groups_G0017", "label": "DragonOK", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Earth Lusca is a suspected China-based cyber espionage group that has been active since at least April 2019. Earth Lusca has targeted organizations in Australia, China, Hong Kong, Mongolia, Nepal, the Philippines, Taiwan, Thailand, Vietnam, the United Arab Emirates, Nigeria, Germany, France, and the United States. Targets included government institutions, news media outlets, gambling companies, educational institutions, COVID-19 research organizations, telecommunications companies, religious movements banned in China, and cryptocurrency trading platforms; security researchers assess some Earth Lusca operations may be financially motivated.Earth Lusca has used malware commonly used by other Chinese threat groups, including APT41 and the Winnti Group cluster, however security researchers assess Earth Lusca\u0027s techniques and infrastructure are separate.", "id": "attack_groups_G1006", "label": "Earth Lusca", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Elderwood is a suspected Chinese cyber espionage group that was reportedly responsible for the 2009 Google intrusion known as Operation Aurora.  The group has targeted defense organizations, supply chain manufacturers, human rights and nongovernmental organizations (NGOs), and IT service providers.", "id": "attack_groups_G0066", "label": "Elderwood", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Ember Bear is a suspected Russian state-sponsored cyber espionage group that has been active since at least March 2021. Ember Bear has primarily focused their operations against Ukraine and Georgia, but has also targeted Western European and North American foreign ministries, pharmaceutical companies, and financial sector organizations. Security researchers assess Ember Bear likely conducted the WhisperGate destructive wiper attacks against Ukraine in early 2022.", "id": "attack_groups_G1003", "label": "Ember Bear", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Equation is a sophisticated threat group that employs multiple remote access tools. The group is known to use zero-day exploits and has developed the capability to overwrite the firmware of hard disk drives.", "id": "attack_groups_G0020", "label": "Equation", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Evilnum is a financially motivated threat group that has been active since at least 2018.", "id": "attack_groups_G0120", "label": "Evilnum", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "EXOTIC LILY is a financially motivated group that has been closely linked with Wizard Spider and the deployment of ransomware including Conti and Diavol. EXOTIC LILY may be acting as an initial access broker for other malicious actors, and has targeted a wide range of industries including IT, cybersecurity, and healthcare since at least September 2021.", "id": "attack_groups_G1011", "label": "EXOTIC LILY", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Ferocious Kitten is a threat group that has primarily targeted Persian-speaking individuals in Iran since at least 2015.", "id": "attack_groups_G0137", "label": "Ferocious Kitten", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN10 is a financially motivated threat group that has targeted organizations in North America since at least 2013 through 2016. The group uses stolen data exfiltrated from victims to extort organizations.", "id": "attack_groups_G0051", "label": "FIN10", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN4 is a financially-motivated threat group that has targeted confidential information related to the public financial market, particularly regarding healthcare and pharmaceutical companies, since at least 2013. FIN4 is unique in that they do not infect victims with typical persistent malware, but rather they focus on capturing credentials authorized to access email and other non-public correspondence.", "id": "attack_groups_G0085", "label": "FIN4", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN5 is a financially motivated threat group that has targeted personally identifiable information and payment card information. The group has been active since at least 2008 and has targeted the restaurant, gaming, and hotel industries. The group is made up of actors who likely speak Russian.", "id": "attack_groups_G0053", "label": "FIN5", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN6 is a cyber crime group that has stolen payment card data and sold it for profit on underground marketplaces. This group has aggressively targeted and compromised point of sale (PoS) systems in the hospitality and retail sectors.", "id": "attack_groups_G0037", "label": "FIN6", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN7 is a financially-motivated threat group that has been active since 2013 primarily targeting the U.S. retail, restaurant, and hospitality sectors, often using point-of-sale malware. A portion of FIN7 was run out of a front company called Combi Security. Since 2020 FIN7 shifted operations to a big game hunting (BGH) approach including use of REvil ransomware and their own Ransomware as a Service (RaaS), Darkside. FIN7 may be linked to the Carbanak Group, but there appears to be several groups using Carbanak malware and are therefore tracked separately.", "id": "attack_groups_G0046", "label": "FIN7", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FIN8 is a financially motivated threat group known to launch tailored spearphishing campaigns targeting the retail, restaurant, and hospitality industries.", "id": "attack_groups_G0061", "label": "FIN8", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Fox Kitten is threat actor with a suspected nexus to the Iranian government that has been active since at least 2017 against entities in the Middle East, North Africa, Europe, Australia, and North America. Fox Kitten has targeted multiple industrial verticals including oil and gas, technology, government, defense, healthcare, manufacturing, and engineering.", "id": "attack_groups_G0117", "label": "Fox Kitten", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "GALLIUM is a cyberespionage group that has been active since at least 2012, primarily targeting telecommunications companies, financial institutions, and government entities in Afghanistan, Australia, Belgium, Cambodia, Malaysia, Mozambique, the Philippines, Russia, and Vietnam. Security researchers have identified GALLIUM as a likely Chinese state-sponsored group, based in part on tools used and TTPs commonly associated with Chinese threat actors.", "id": "attack_groups_G0093", "label": "GALLIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Gallmaker is a cyberespionage group that has targeted victims in the Middle East and has been active since at least December 2017. The group has mainly targeted victims in the defense, military, and government sectors.", "id": "attack_groups_G0084", "label": "Gallmaker", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Gamaredon Group is a suspected Russian cyber espionage threat group that has targeted military, NGO, judiciary, law enforcement, and non-profit organizations in Ukraine since at least 2013. The name Gamaredon Group comes from a misspelling of the word \"Armageddon\", which was detected in the adversary\u0027s early campaigns.In November 2021, the Ukrainian government publicly attributed Gamaredon Group to Russia\u0027s Federal Security Service (FSB) Center 18.", "id": "attack_groups_G0047", "label": "Gamaredon Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "GCMAN is a threat group that focuses on targeting banks for the purpose of transferring money to e-currency services.", "id": "attack_groups_G0036", "label": "GCMAN", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "GOLD SOUTHFIELD is a financially motivated threat group active since at least 2018 that operates the REvil Ransomware-as-a Service (RaaS). GOLD SOUTHFIELD provides backend infrastructure for affiliates recruited on underground forums to perpetrate high value deployments. By early 2020, GOLD SOUTHFIELD started capitalizing on the new trend of stealing data and further extorting the victim to pay for their data to not get publicly leaked.", "id": "attack_groups_G0115", "label": "GOLD SOUTHFIELD", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Gorgon Group is a threat group consisting of members who are suspected to be Pakistan-based or have other connections to Pakistan. The group has performed a mix of criminal and targeted attacks, including campaigns against government organizations in the United Kingdom, Spain, Russia, and the United States.", "id": "attack_groups_G0078", "label": "Gorgon Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Group5 is a threat group with a suspected Iranian nexus, though this attribution is not definite. The group has targeted individuals connected to the Syrian opposition via spearphishing and watering holes, normally using Syrian and Iranian themes. Group5 has used two commonly available remote access tools (RATs), njRAT and NanoCore, as well as an Android RAT, DroidJack.", "id": "attack_groups_G0043", "label": "Group5", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "HAFNIUM is a likely state-sponsored cyber espionage group operating out of China that has been active since at least January 2021. HAFNIUM primarily targets entities in the US across a number of industry sectors, including infectious disease researchers, law firms, higher education institutions, defense contractors, policy think tanks, and NGOs.", "id": "attack_groups_G0125", "label": "HAFNIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "HEXANE is a cyber espionage threat group that has targeted oil \u0026 gas, telecommunications, aviation, and internet service provider organizations since at least 2017. Targeted companies have been located in the Middle East and Africa, including Israel, Saudi Arabia, Kuwait, Morocco, and Tunisia. HEXANE\u0027s TTPs appear similar to APT33 and OilRig but due to differences in victims and tools it is tracked as a separate entity.", "id": "attack_groups_G1001", "label": "HEXANE", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Higaisa is a threat group suspected to have South Korean origins. Higaisa has targeted government, public, and trade organizations in North Korea; however, they have also carried out attacks in China, Japan, Russia, Poland, and other nations. Higaisa was first disclosed in early 2019 but is assessed to have operated as early as 2009.", "id": "attack_groups_G0126", "label": "Higaisa", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Inception is a cyber espionage group active since at least 2014. The group has targeted multiple industries and governmental entities primarily in Russia, but has also been active in the United States and throughout Europe, Asia, Africa, and the Middle East.", "id": "attack_groups_G0100", "label": "Inception", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "IndigoZebra is a suspected Chinese cyber espionage group that has been targeting Central Asian governments since at least 2014.", "id": "attack_groups_G0136", "label": "IndigoZebra", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Indrik Spider is a Russia-based cybercriminal group that has been active since at least 2014. Indrik Spider initially started with the Dridex banking Trojan, and then by 2017 they began running ransomware operations using BitPaymer, WastedLocker, and Hades ransomware.", "id": "attack_groups_G0119", "label": "Indrik Spider", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Ke3chang is a threat group attributed to actors operating out of China. Ke3chang has targeted oil, government, diplomatic, military, and NGOs in Central and South America, the Caribbean, Europe, and North America since at least 2010.", "id": "attack_groups_G0004", "label": "Ke3chang", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Kimsuky is a North Korea-based cyber espionage group that has been active since at least 2012. The group initially focused on targeting South Korean government entities, think tanks, and individuals identified as experts in various fields, and expanded its operations to include the United States, Russia, Europe, and the UN. Kimsuky has focused its intelligence collection activities on foreign policy and national security issues related to the Korean peninsula, nuclear policy, and sanctions.Kimsuky was assessed to be responsible for the 2014 Korea Hydro \u0026 Nuclear Power Co. compromise; other notable campaigns include Operation STOLEN PENCIL (2018), Operation Kabar Cobra (2019), and Operation Smoke Screen (2019).North Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups.", "id": "attack_groups_G0094", "label": "Kimsuky", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "LAPSUS$ is cyber criminal threat group that has been active since at least mid-2021. LAPSUS$ specializes in large-scale social engineering and extortion operations, including destructive attacks without the use of ransomware. The group has targeted organizations globally, including in the government, manufacturing, higher education, energy, healthcare, technology, telecommunications, and media sectors.", "id": "attack_groups_G1004", "label": "LAPSUS$", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Lazarus Group is a North Korean state-sponsored cyber threat group that has been attributed to the Reconnaissance General Bureau. The group has been active since at least 2009 and was reportedly responsible for the November 2014 destructive wiper attack against Sony Pictures Entertainment as part of a campaign named Operation Blockbuster by Novetta. Malware used by Lazarus Group correlates to other reported campaigns, including Operation Flame, Operation 1Mission, Operation Troy, DarkSeoul, and Ten Days of Rain. North Korean group definitions are known to have significant overlap, and some security researchers report all North Korean state-sponsored cyber activity under the name Lazarus Group instead of tracking clusters or subgroups, such as Andariel, APT37, APT38, and Kimsuky.", "id": "attack_groups_G0032", "label": "Lazarus Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "LazyScripter is threat group that has mainly targeted the airlines industry since at least 2018, primarily using open-source toolsets.", "id": "attack_groups_G0140", "label": "LazyScripter", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Leafminer is an Iranian threat group that has targeted government organizations and business entities in the Middle East since at least early 2017.", "id": "attack_groups_G0077", "label": "Leafminer", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Leviathan is a Chinese state-sponsored cyber espionage group that has been attributed to the Ministry of State Security\u0027s (MSS) Hainan State Security Department and an affiliated front company. Active since at least 2009, Leviathan has targeted the following sectors: academia, aerospace/aviation, biomedical, defense industrial base, government, healthcare, manufacturing, maritime, and transportation across the US, Canada, Europe, the Middle East, and Southeast Asia.", "id": "attack_groups_G0065", "label": "Leviathan", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Lotus Blossom is a threat group that has targeted government and military organizations in Southeast Asia.", "id": "attack_groups_G0030", "label": "Lotus Blossom", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "LuminousMoth is a Chinese-speaking cyber espionage group that has been active since at least October 2020. LuminousMoth has targeted high-profile organizations, including government entities, in Myanmar, the Philippines, Thailand, and other parts of Southeast Asia. Some security researchers have concluded there is a connection between LuminousMoth and Mustang Panda based on similar targeting and TTPs, as well as network infrastructure overlaps.", "id": "attack_groups_G1014", "label": "LuminousMoth", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Machete is a suspected Spanish-speaking cyber espionage group that has been active since at least 2010. It has primarily focused its operations within Latin America, with a particular emphasis on Venezuela, but also in the US, Europe, Russia, and parts of Asia. Machete generally targets high-profile organizations such as government institutions, intelligence services, and military units, as well as telecommunications and power companies.", "id": "attack_groups_G0095", "label": "Machete", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Magic Hound is an Iranian-sponsored threat group that conducts long term, resource-intensive cyber espionage operations, likely on behalf of the Islamic Revolutionary Guard Corps. They have targeted European, U.S., and Middle Eastern government and military personnel, academics, journalists, and organizations such as the World Health Organization (WHO), via complex social engineering campaigns since at least 2014.", "id": "attack_groups_G0059", "label": "Magic Hound", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "menuPass is a threat group that has been active since at least 2006. Individual members of menuPass are known to have acted in association with the Chinese Ministry of State Security\u0027s (MSS) Tianjin State Security Bureau and worked for the Huaying Haitai Science and Technology Development Company.menuPass has targeted healthcare, defense, aerospace, finance, maritime, biotechnology, energy, and government sectors globally, with an emphasis on Japanese organizations. In 2016 and 2017, the group is known to have targeted managed IT service providers (MSPs), manufacturing and mining companies, and a university.", "id": "attack_groups_G0045", "label": "menuPass", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Metador is a suspected cyber espionage group that was first reported in September 2022. Metador has targeted a limited number of telecommunication companies, internet service providers, and universities in the Middle East and Africa. Security researchers named the group Metador based on the \"I am meta\" string in one of the group\u0027s malware samples and the expectation of Spanish-language responses from C2 servers.", "id": "attack_groups_G1013", "label": "Metador", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Moafee is a threat group that appears to operate from the Guandong Province of China. Due to overlapping TTPs, including similar custom tools, Moafee is thought to have a direct or indirect relationship with the threat group DragonOK.", "id": "attack_groups_G0002", "label": "Moafee", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Mofang is a likely China-based cyber espionage group, named for its frequent practice of imitating a victim\u0027s infrastructure. This adversary has been observed since at least May 2012 conducting focused attacks against government and critical infrastructure in Myanmar, as well as several other countries and sectors including military, automobile, and weapons industries.", "id": "attack_groups_G0103", "label": "Mofang", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Molerats is an Arabic-speaking, politically-motivated threat group that has been operating since 2012. The group\u0027s victims have primarily been in the Middle East, Europe, and the United States.", "id": "attack_groups_G0021", "label": "Molerats", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Moses Staff is a suspected Iranian threat group that has primarily targeted Israeli companies since at least September 2021. Moses Staff openly stated their motivation in attacking Israeli companies is to cause damage by leaking stolen sensitive data and encrypting the victim\u0027s networks without a ransom demand. Security researchers assess Moses Staff is politically motivated, and has targeted government, finance, travel, energy, manufacturing, and utility companies outside of Israel as well, including those in Italy, India, Germany, Chile, Turkey, the UAE, and the US.", "id": "attack_groups_G1009", "label": "Moses Staff", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "MuddyWater is a cyber espionage group assessed to be a subordinate element within Iran\u0027s Ministry of Intelligence and Security (MOIS). Since at least 2017, MuddyWater has targeted a range of government and private organizations across sectors, including telecommunications, local government, defense, and oil and natural gas organizations, in the Middle East, Asia, Africa, Europe, and North America.", "id": "attack_groups_G0069", "label": "MuddyWater", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Mustang Panda is a China-based cyber espionage threat actor that was first observed in 2017 but may have been conducting operations since at least 2014. Mustang Panda has targeted government entities, nonprofits, religious, and other non-governmental organizations in the U.S., Europe, Mongolia, Myanmar, Pakistan, and Vietnam, among others.", "id": "attack_groups_G0129", "label": "Mustang Panda", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Naikon is assessed to be a state-sponsored cyber espionage group attributed to the Chinese People\u2019s Liberation Army\u2019s (PLA) Chengdu Military Region Second Technical Reconnaissance Bureau (Military Unit Cover Designator 78020). Active since at least 2010, Naikon has primarily conducted operations against government, military, and civil organizations in Southeast Asia, as well as against international bodies such as the United Nations Development Programme (UNDP) and the Association of Southeast Asian Nations (ASEAN). While Naikon shares some characteristics with APT30, the two groups do not appear to be exact matches.", "id": "attack_groups_G0019", "label": "Naikon", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "NEODYMIUM is an activity group that conducted a campaign in May 2016 and has heavily targeted Turkish victims. The group has demonstrated similarity to another activity group called PROMETHIUM due to overlapping victim and campaign characteristics.   NEODYMIUM is reportedly associated closely with BlackOasis operations, but evidence that the group names are aliases has not been identified.", "id": "attack_groups_G0055", "label": "NEODYMIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Nomadic Octopus is a Russian-speaking cyber espionage threat group that has primarily targeted Central Asia, including local governments, diplomatic missions, and individuals, since at least 2014. Nomadic Octopus has been observed conducting campaigns involving Android and Windows malware, mainly using the Delphi programming language, and building custom variants.", "id": "attack_groups_G0133", "label": "Nomadic Octopus", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "OilRig is a suspected Iranian threat group that has targeted Middle Eastern and international victims since at least 2014. The group has targeted a variety of sectors, including financial, government, energy, chemical, and telecommunications. It appears the group carries out supply chain attacks, leveraging the trust relationship between organizations to attack their primary targets. FireEye assesses that the group works on behalf of the Iranian government based on infrastructure details that contain references to Iran, use of Iranian infrastructure, and targeting that aligns with nation-state interests.", "id": "attack_groups_G0049", "label": "OilRig", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Orangeworm is a group that has targeted organizations in the healthcare sector in the United States, Europe, and Asia since at least 2015, likely for the purpose of corporate espionage.", "id": "attack_groups_G0071", "label": "Orangeworm", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Patchwork is a cyber espionage group that was first observed in December 2015. While the group has not been definitively attributed, circumstantial evidence suggests the group may be a pro-Indian or Indian entity. Patchwork has been seen targeting industries related to diplomatic and government agencies. Much of the code used by this group was copied and pasted from online forums. Patchwork was also seen operating spearphishing campaigns targeting U.S. think tank groups in March and April of 2018.", "id": "attack_groups_G0040", "label": "Patchwork", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "PittyTiger is a threat group believed to operate out of China that uses multiple different types of malware to maintain command and control.", "id": "attack_groups_G0011", "label": "PittyTiger", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "PLATINUM is an activity group that has targeted victims since at least 2009. The group has focused on targets associated with governments and related organizations in South and Southeast Asia.", "id": "attack_groups_G0068", "label": "PLATINUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "POLONIUM is a Lebanon-based group that has primarily targeted Israeli organizations, including critical manufacturing, information technology, and defense industry companies, since at least February 2022. Security researchers assess POLONIUM has coordinated their operations with multiple actors affiliated with Iran\u2019s Ministry of Intelligence and Security (MOIS), based on victim overlap as well as common techniques and tooling.", "id": "attack_groups_G1005", "label": "POLONIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Poseidon Group is a Portuguese-speaking threat group that has been active since at least 2005. The group has a history of using information exfiltrated from victims to blackmail victim companies into contracting the Poseidon Group as a security firm.", "id": "attack_groups_G0033", "label": "Poseidon Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "PROMETHIUM is an activity group focused on espionage that has been active since at least 2012. The group has conducted operations globally with a heavy emphasis on Turkish targets. PROMETHIUM has demonstrated similarity to another activity group called NEODYMIUM due to overlapping victim and campaign characteristics.", "id": "attack_groups_G0056", "label": "PROMETHIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Putter Panda is a Chinese threat group that has been attributed to Unit 61486 of the 12th Bureau of the PLA\u2019s 3rd General Staff Department (GSD).", "id": "attack_groups_G0024", "label": "Putter Panda", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Rancor is a threat group that has led targeted campaigns against the South East Asia region. Rancor uses politically-motivated lures to entice victims to open malicious documents.", "id": "attack_groups_G0075", "label": "Rancor", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Rocke is an alleged Chinese-speaking adversary whose primary objective appeared to be cryptojacking, or stealing victim system resources for the purposes of mining cryptocurrency. The name Rocke comes from the email address \"rocke@live.cn\" used to create the wallet which held collected cryptocurrency. Researchers have detected overlaps between Rocke and the Iron Cybercrime Group, though this attribution has not been confirmed.", "id": "attack_groups_G0106", "label": "Rocke", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "RTM is a cybercriminal group that has been active since at least 2015 and is primarily interested in users of remote banking systems in Russia and neighboring countries. The group uses a Trojan by the same name (RTM).", "id": "attack_groups_G0048", "label": "RTM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Sandworm Team is a destructive threat group that has been attributed to Russia\u0027s General Staff Main Intelligence Directorate (GRU) Main Center for Special Technologies (GTsST) military unit 74455. This group has been active since at least 2009.In October 2020, the US indicted six GRU Unit 74455 officers associated with Sandworm Team for the following cyber operations: the 2015 and 2016 attacks against Ukrainian electrical companies and government organizations, the 2017 worldwide NotPetya attack, targeting of the 2017 French presidential campaign, the 2018 Olympic Destroyer attack against the Winter Olympic Games, the 2018 operation against the Organisation for the Prohibition of Chemical Weapons, and attacks against the country of Georgia in 2018 and 2019. Some of these were conducted with the assistance of GRU Unit 26165, which is also referred to as APT28.", "id": "attack_groups_G0034", "label": "Sandworm Team", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Scarlet Mimic is a threat group that has targeted minority rights activists. This group has not been directly linked to a government source, but the group\u0027s motivations appear to overlap with those of the Chinese government. While there is some overlap between IP addresses used by Scarlet Mimic and Putter Panda, it has not been concluded that the groups are the same.", "id": "attack_groups_G0029", "label": "Scarlet Mimic", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "SideCopy is a Pakistani threat group that has primarily targeted South Asian countries, including Indian and Afghani government personnel, since at least 2019. SideCopy\u0027s name comes from its infection chain that tries to mimic that of Sidewinder, a suspected Indian threat group.", "id": "attack_groups_G1008", "label": "SideCopy", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Sidewinder is a suspected Indian threat actor group that has been active since at least 2012. They have been observed targeting government, military, and business entities throughout Asia, primarily focusing on Pakistan, China, Nepal, and Afghanistan.", "id": "attack_groups_G0121", "label": "Sidewinder", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Silence is a financially motivated threat actor targeting financial institutions in different countries. The group was first seen in June 2016. Their main targets reside in Russia, Ukraine, Belarus, Azerbaijan, Poland and Kazakhstan. They compromised various banking systems, including the Russian Central Bank\u0027s Automated Workstation Client, ATMs, and card processing.", "id": "attack_groups_G0091", "label": "Silence", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Silent Librarian is a group that has targeted research and proprietary data at universities, government agencies, and private sector companies worldwide since at least 2013. Members of  Silent Librarian are known to have been affiliated with the Iran-based Mabna Institute which has conducted cyber intrusions at the behest of the government of Iran, specifically the Islamic Revolutionary Guard Corps (IRGC).", "id": "attack_groups_G0122", "label": "Silent Librarian", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "SilverTerrier is a Nigerian threat group that has been seen active since 2014. SilverTerrier mainly targets organizations in high technology, higher education, and manufacturing.", "id": "attack_groups_G0083", "label": "SilverTerrier", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Sowbug is a threat group that has conducted targeted attacks against organizations in South America and Southeast Asia, particularly government entities, since at least 2015.", "id": "attack_groups_G0054", "label": "Sowbug", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Stealth Falcon is a threat group that has conducted targeted spyware attacks against Emirati journalists, activists, and dissidents since at least 2012. Circumstantial evidence suggests there could be a link between this group and the United Arab Emirates (UAE) government, but that has not been confirmed.", "id": "attack_groups_G0038", "label": "Stealth Falcon", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Strider is a threat group that has been active since at least 2011 and has targeted victims in Russia, China, Sweden, Belgium, Iran, and Rwanda.", "id": "attack_groups_G0041", "label": "Strider", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Suckfly is a China-based threat group that has been active since at least 2014.", "id": "attack_groups_G0039", "label": "Suckfly", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "TA459 is a threat group believed to operate out of China that has targeted countries including Russia, Belarus, Mongolia, and others.", "id": "attack_groups_G0062", "label": "TA459", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "TA505 is a cyber criminal group that has been active since at least 2014. TA505 is known for frequently changing malware, driving global trends in criminal malware distribution, and ransomware campaigns involving Clop.", "id": "attack_groups_G0092", "label": "TA505", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "TA551 is a financially-motivated threat group that has been active since at least 2018.  The group has primarily targeted English, German, Italian, and Japanese speakers through email-based malware distribution campaigns.", "id": "attack_groups_G0127", "label": "TA551", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "TeamTNT is a threat group that has primarily targeted cloud and containerized environments. The group as been active since at least October 2019 and has mainly focused its efforts on leveraging cloud and container resources to deploy cryptocurrency miners in victim environments.", "id": "attack_groups_G0139", "label": "TeamTNT", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "TEMP.Veles is a Russia-based threat group that has targeted critical infrastructure. The group has been observed utilizing TRITON, a malware framework designed to manipulate industrial safety systems.", "id": "attack_groups_G0088", "label": "TEMP.Veles", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "The White Company is a likely state-sponsored threat actor with advanced capabilities. From 2017 through 2018, the group led an espionage campaign called Operation Shaheen targeting government and military organizations in Pakistan.", "id": "attack_groups_G0089", "label": "The White Company", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Threat Group-1314 is an unattributed threat group that has used compromised credentials to log into a victim\u0027s remote access infrastructure.", "id": "attack_groups_G0028", "label": "Threat Group-1314", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Threat Group-3390 is a Chinese threat group that has extensively used strategic Web compromises to target victims. The group has been active since at least 2010 and has targeted organizations in the aerospace, government, defense, technology, energy, manufacturing and gambling/betting sectors.", "id": "attack_groups_G0027", "label": "Threat Group-3390", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Thrip is an espionage group that has targeted satellite communications, telecoms, and defense contractor companies in the U.S. and Southeast Asia. The group uses custom malware as well as \"living off the land\" techniques.", "id": "attack_groups_G0076", "label": "Thrip", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Tonto Team is a suspected Chinese state-sponsored cyber espionage threat group that has primarily targeted South Korea, Japan, Taiwan, and the United States since at least 2009; by 2020 they expanded operations to include other Asian as well as Eastern European countries. Tonto Team has targeted government, military, energy, mining, financial, education, healthcare, and technology organizations, including through the Heartbeat Campaign (2009-2012) and Operation Bitter Biscuit (2017).", "id": "attack_groups_G0131", "label": "Tonto Team", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Transparent Tribe is a suspected Pakistan-based threat group that has been active since at least 2013, primarily targeting diplomatic, defense, and research organizations in India and Afghanistan.", "id": "attack_groups_G0134", "label": "Transparent Tribe", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Tropic Trooper is an unaffiliated threat group that has led targeted campaigns against targets in Taiwan, the Philippines, and Hong Kong. Tropic Trooper focuses on targeting government, healthcare, transportation, and high-tech industries and has been active since 2011.", "id": "attack_groups_G0081", "label": "Tropic Trooper", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Turla is a Russian-based threat group that has infected victims in over 45 countries, spanning a range of industries including government, embassies, military, education, research and pharmaceutical companies since 2004. Heightened activity was seen in mid-2015. Turla is known for conducting watering hole and spearphishing campaigns and leveraging in-house tools and malware. Turla\u2019s espionage platform is mainly used against Windows machines, but has also been seen used against macOS and Linux machines.", "id": "attack_groups_G0010", "label": "Turla", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Volatile Cedar is a Lebanese threat group that has targeted individuals, companies, and institutions worldwide. Volatile Cedar has been operating since 2012 and is motivated by political and ideological interests.", "id": "attack_groups_G0123", "label": "Volatile Cedar", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Whitefly is a cyber espionage group that has been operating since at least 2017. The group has targeted organizations based mostly in Singapore across a wide variety of sectors, and is primarily interested in stealing large amounts of sensitive information. The group has been linked to an attack against Singapore\u2019s largest public health organization, SingHealth.", "id": "attack_groups_G0107", "label": "Whitefly", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "The Windigo group has been operating since at least 2011, compromising thousands of Linux and Unix servers using the Ebury SSH backdoor to create a spam botnet. Despite law enforcement intervention against the creators, Windigo operators continued updating Ebury through 2019.", "id": "attack_groups_G0124", "label": "Windigo", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Windshift is a threat group that has been active since at least 2017, targeting specific individuals for surveillance in government departments and critical infrastructure across the Middle East.", "id": "attack_groups_G0112", "label": "Windshift", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Winnti Group is a threat group with Chinese origins that has been active since at least 2010. The group has heavily targeted the gaming industry, but it has also expanded the scope of its targeting. Some reporting suggests a number of other groups, including Axiom, APT17, and Ke3chang, are closely linked to Winnti Group.", "id": "attack_groups_G0044", "label": "Winnti Group", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "WIRTE is a threat group that has been active since at least August 2018. WIRTE has targeted government, diplomatic, financial, military, legal, and technology organizations in the Middle East and Europe.", "id": "attack_groups_G0090", "label": "WIRTE", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Wizard Spider is a Russia-based financially motivated threat group originally known for the creation and deployment of TrickBot since at least 2016. Wizard Spider possesses a diverse arsenal of tools and has conducted ransomware campaigns against a variety of organizations, ranging from major corporations to hospitals.", "id": "attack_groups_G0102", "label": "Wizard Spider", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "ZIRCONIUM is a threat group operating out of China, active since at least 2017, that has targeted individuals associated with the 2020 US presidential election and prominent leaders in the international affairs community.", "id": "attack_groups_G0128", "label": "ZIRCONIUM", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "2016 Ukraine Electric Power Attack was a Sandworm Team campaign during which they used Industroyer malware to target and disrupt distribution substations within the Ukrainian power grid. This campaign was the second major public attack conducted against Ukraine by Sandworm Team.", "id": "campaigns_C0025", "label": "2016 Ukraine Electric Power Attack", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0010 was a cyber espionage campaign conducted by UNC3890 that targeted Israeli shipping, government, aviation, energy, and healthcare organizations. Security researcher assess UNC3890 conducts operations in support of Iranian interests, and noted several limited technical connections to Iran, including PDB strings and Farsi language artifacts. C0010 began by at least late 2020, and was still ongoing as of mid-2022.", "id": "campaigns_C0010", "label": "C0010", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0011 was a suspected cyber espionage campaign conducted by Transparent Tribe that targeted students at universities and colleges in India. Security researchers noted this campaign against students was a significant shift from Transparent Tribe\u0027s historic targeting Indian government, military, and think tank personnel, and assessed it was still ongoing as of July 2022.", "id": "campaigns_C0011", "label": "C0011", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0015 was a ransomware intrusion during which the unidentified attackers used Bazar, Cobalt Strike, and Conti, along with other tools, over a 5 day period. Security researchers assessed the actors likely used the widely-circulated Conti ransomware playbook based on the observed pattern of activity and operator errors.", "id": "campaigns_C0015", "label": "C0015", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0017 was an APT41 campaign conducted between May 2021 and February 2022 that successfully compromised at least six U.S. state government networks through the exploitation of vulnerable Internet facing web applications. During C0017, APT41 was quick to adapt and use publicly-disclosed as well as zero-day vulnerabilities for initial access, and in at least two cases re-compromised victims following remediation efforts. The goals of C0017 are unknown, however APT41 was observed exfiltrating Personal Identifiable Information (PII).", "id": "campaigns_C0017", "label": "C0017", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0018 was a month-long ransomware intrusion that successfully deployed AvosLocker onto a compromised network. The unidentified actors gained initial access to the victim network through an exposed server and used a variety of open-source tools prior to executing AvosLocker.", "id": "campaigns_C0018", "label": "C0018", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "C0021 was a spearphishing campaign conducted in November 2018 that targeted public sector institutions, non-governmental organizations (NGOs), educational institutions, and private-sector corporations in the oil and gas, chemical, and hospitality industries. The majority of targets were located in the US, particularly in and around Washington D.C., with other targets located in Europe, Hong Kong, India, and Canada. C0021\u0027s technical artifacts, tactics, techniques, and procedures (TTPs), and targeting overlap with previous suspected APT29 activity.", "id": "campaigns_C0021", "label": "C0021", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "CostaRicto was a suspected hacker-for-hire cyber espionage campaign that targeted multiple industries worldwide, with a large number being financial institutions. CostaRicto actors targeted organizations in Europe, the Americas, Asia, Australia, and Africa, with a large concentration in South Asia (especially India, Bangladesh, and Singapore), using custom malware, open source tools, and a complex network of proxies and SSH tunnels.", "id": "campaigns_C0004", "label": "CostaRicto", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Frankenstein was described by security researchers as a highly-targeted campaign conducted by moderately sophisticated and highly resourceful threat actors in early 2019. The unidentified actors primarily relied on open source tools, including Empire. The campaign name refers to the actors\u0027 ability to piece together several unrelated open-source tool components.", "id": "campaigns_C0001", "label": "Frankenstein", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "FunnyDream was a suspected Chinese cyber espionage campaign that targeted government and foreign organizations in Malaysia, the Philippines, Taiwan, Vietnam, and other parts of Southeast Asia. Security researchers linked the FunnyDream campaign to possible Chinese-speaking threat actors through the use of the Chinoxy backdoor and noted infrastructure overlap with the TAG-16 threat group.", "id": "campaigns_C0007", "label": "FunnyDream", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Maroochy Water Breach was an incident in 2000 where an adversary leveraged the local government\u2019s wastewater control system and stolen engineering equipment to disrupt and eventually release 800,000 liters of raw sewage into the local community.", "id": "campaigns_C0020", "label": "Maroochy Water Breach", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Night Dragon was a cyber espionage campaign that targeted oil, energy, and petrochemical companies, along with individuals and executives in Kazakhstan, Taiwan, Greece, and the United States. The unidentified threat actors searched for information related to oil and gas field production systems, financials, and collected data from SCADA systems. Based on the observed techniques, tools, and network activities, security researchers assessed the campaign involved a threat group based in China.", "id": "campaigns_C0002", "label": "Night Dragon", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Oldsmar Treatment Plant Intrusion was a cyber incident involving a water treatment facility in Florida. During this incident, unidentified threat actors leveraged features of the system to access and modify setpoints for a specific chemical required in the treatment process. The incident was detected immediately and prevented before it could cause any harm to the public.", "id": "campaigns_C0009", "label": "Oldsmar Treatment Plant Intrusion", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation CuckooBees was a cyber espionage campaign targeting technology and manufacturing companies in East Asia, Western Europe, and North America since at least 2019. Security researchers noted the goal of Operation CuckooBees, which was still ongoing as of May 2022, was likely the theft of proprietary information, research and development documents, source code, and blueprints for various technologies. Researchers assessed Operation CuckooBees was conducted by actors affiliated with Winnti Group, APT41, and BARIUM.", "id": "campaigns_C0012", "label": "Operation CuckooBees", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Dream Job was a cyber espionage operation likely conducted by Lazarus Group that targeted the defense, aerospace, government, and other sectors in the United States, Israel, Australia, Russia, and India. In at least one case, the cyber actors tried to monetize their network access to conduct a business email compromise (BEC) operation. In 2020, security researchers noted overlapping TTPs, to include fake job lures and code similarities, between Operation Dream Job, Operation North Star, and Operation Interception; by 2022 security researchers described Operation Dream Job as an umbrella term covering both Operation Interception and Operation North Star.", "id": "campaigns_C0022", "label": "Operation Dream Job", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Dust Storm was a long-standing persistent cyber espionage campaign that targeted multiple industries in Japan, South Korea, the United States, Europe, and several Southeast Asian countries. By 2015, the Operation Dust Storm threat actors shifted from government and defense-related intelligence targets to Japanese companies or Japanese subdivisions of larger foreign organizations supporting Japan\u0027s critical infrastructure, including electricity generation, oil and natural gas, finance, transportation, and construction.Operation Dust Storm threat actors also began to use Android backdoors in their operations by 2015, with all identified victims at the time residing in Japan or South Korea.", "id": "campaigns_C0016", "label": "Operation Dust Storm", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Ghost was an APT29 campaign starting in 2013 that included operations against ministries of foreign affairs in Europe and the Washington, D.C. embassy of a European Union country. During Operation Ghost, APT29 used new families of malware and leveraged web services, steganography, and unique C2 infrastructure for each victim.", "id": "campaigns_C0023", "label": "Operation Ghost", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Honeybee was a campaign that targeted humanitarian aid and inter-Korean affairs organizations from at least late 2017 through early 2018. Operation Honeybee initially targeted South Korea, but expanded to include Vietnam, Singapore, Japan, Indonesia, Argentina, and Canada. Security researchers assessed the threat actors were likely Korean speakers based on metadata used in both lure documents and executables, and named the campaign \"Honeybee\" after the author name discovered in malicious Word documents.", "id": "campaigns_C0006", "label": "Operation Honeybee", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Sharpshooter was a global cyber espionage campaign that targeted nuclear, defense, government, energy, and financial companies, with many located in Germany, Turkey, the United Kingdom, and the United States. Security researchers noted the campaign shared many similarities with previous Lazarus Group operations, including fake job recruitment lures and shared malware code.", "id": "campaigns_C0013", "label": "Operation Sharpshooter", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Spalax was a campaign that primarily targeted Colombian government organizations and private companies, particularly those associated with the energy and metallurgical industries. The Operation Spalax threat actors distributed commodity malware and tools using generic phishing topics related to COVID-19, banking, and law enforcement action. Security researchers noted indicators of compromise and some infrastructure overlaps with other campaigns dating back to April 2018, including at least one separately attributed to APT-C-36, however identified enough differences to report this as separate, unattributed activity.", "id": "campaigns_C0005", "label": "Operation Spalax", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "Operation Wocao was a cyber espionage campaign that targeted organizations around the world, including in Brazil, China, France, Germany, Italy, Mexico, Portugal, Spain, the United Kingdom, and the United States. The suspected China-based actors compromised government organizations and managed service providers, as well as aviation, construction, energy, finance, health care, insurance, offshore engineering, software development, and transportation companies.Security researchers assessed the Operation Wocao actors used similar TTPs and tools as APT20, suggesting a possible overlap. Operation Wocao was named after an observed command line entry by one of the threat actors, possibly out of frustration from losing webshell access.", "id": "campaigns_C0014", "label": "Operation Wocao", "shape": "dot", "size": 10}, {"color": "#97c2fc", "description": "The SolarWinds Compromise was a sophisticated supply chain cyber operation conducted by APT29 that was discovered in mid-December 2020. APT29 used customized malware to inject malicious code into the SolarWinds Orion software build process that was later distributed through a normal software update; they also used password spraying, token theft, API abuse, spear phishing, and other supply chain attacks to compromise user accounts and leverage their associated access. Victims of this campaign included government, consulting, technology, telecom, and other organizations in North America, Europe, Asia, and the Middle East. Industry reporting initially referred to the actors involved in this campaign as UNC2452, NOBELIUM, StellarParticle, Dark Halo, and SolarStorm. In April 2021, the US and UK governments attributed the SolarWinds Compromise to Russia\u0027s Foreign Intelligence Service (SVR); public statements included citations to APT29, Cozy Bear, and The Dukes. The US government assessed that of the approximately 18,000 affected public and private sector customers of Solar Winds\u2019 Orion product, a much smaller number were compromised by follow-on APT29 activity on their systems.", "id": "campaigns_C0024", "label": "SolarWinds Compromise", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"from": "attack_groups_5", "relationship": "related_to", "to": "campaigns_19", "width": 1}, {"from": "attack_groups_13", "relationship": "related_to", "to": "campaigns_6", "width": 1}, {"from": "attack_groups_13", "relationship": "related_to", "to": "campaigns_16", "width": 1}, {"from": "attack_groups_13", "relationship": "related_to", "to": "campaigns_21", "width": 1}, {"from": "attack_groups_21", "relationship": "related_to", "to": "campaigns_4", "width": 1}, {"from": "attack_groups_21", "relationship": "related_to", "to": "campaigns_13", "width": 1}, {"from": "attack_groups_75", "relationship": "related_to", "to": "campaigns_14", "width": 1}, {"from": "attack_groups_75", "relationship": "related_to", "to": "campaigns_18", "width": 1}, {"from": "attack_groups_106", "relationship": "related_to", "to": "campaigns_0", "width": 1}, {"from": "attack_groups_127", "relationship": "related_to", "to": "campaigns_2", "width": 1}, {"from": "attack_groups_134", "relationship": "related_to", "to": "campaigns_13", "width": 1}]);
